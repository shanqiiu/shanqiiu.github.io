<header class="site-header">
    <div class="container nav-wrap">
        <a class="logo" href="{{ site.Home.RelPermalink }}">
            <span class="logo-dot"></span>
            <span class="logo-text">{{ site.Title }}</span>
        </a>
        <nav class="nav" id="site-nav">
            {{ range site.Menus.main }}
                <a class="nav-link" href="{{ .URL | relURL }}">{{ .Name }}</a>
            {{ end }}
        </nav>
        <div class="nav-actions">
            <button class="theme-toggle" id="theme-toggle" aria-label="切换主题" title="切换主题">☾</button>
            <button class="nav-burger" id="nav-burger" aria-label="菜单">☰</button>
        </div>
    </div>
</header>
