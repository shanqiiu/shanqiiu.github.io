{{ define "main" }}
<section class="section container">
    <header class="list-head">
        <h1>归档</h1>
        <p class="list-desc">按年份汇总所有文章、项目与学习记录</p>
    </header>
    {{ $pages := where site.RegularPages "Section" "in" (slice "post" "learning" "projects") }}
    {{ range $pages.GroupByDate "2006" }}
        <h2 class="year">{{ .Key }}</h2>
        <div class="list">
            {{ range .Pages }}
                <a class="list-item" href="{{ .RelPermalink }}">
                    <time>{{ .Date.Format "2006-01-02" }}</time>
                    <span>{{ .Title }}</span>
                </a>
            {{ end }}
        </div>
    {{ end }}
</section>
{{ end }}
