<!doctype html>
<html lang="{{ site.LanguageCode | default "zh-cn" }}" data-theme="dark">
<head>
    {{ partial "head.html" . }}
</head>
<body>
    <a href="#main" class="skip-link">跳转到主内容</a>
    <div id="page-loader" class="page-loader" aria-hidden="true">
        <div class="page-loader-inner">
            <span class="page-loader-spinner"></span>
            <span class="page-loader-text">加载中</span>
        </div>
    </div>
    {{ partial "header.html" . }}

    <main class="main" id="main">
        {{ block "main" . }}{{ end }}
    </main>

    {{ partial "footer.html" . }}
    <script src="https://cdn.jsdelivr.net/npm/medium-zoom@1.1.0/dist/medium-zoom.min.js" defer></script>
    {{ $js := resources.Get "js/main.js" | fingerprint }}
    <script src="{{ $js.RelPermalink }}" defer></script>
</body>
</html>
