- text: "世间好物不坚牢，彩云易散琉璃脆。"
  source: "白居易《简简吟》"
- text: "人生如逆旅，我亦是行人。"
  source: "苏轼《临江仙》"
- text: "竹杖芒鞋轻胜马，谁怕？一蓑烟雨任平生。"
  source: "苏轼《定风波》"
- text: "采菊东篱下，悠然见南山。"
  source: "陶渊明《饮酒·其五》"
- text: "山高月小，水落石出。"
  source: "苏轼《后赤壁赋》"
- text: "落霞与孤鹜齐飞，秋水共长天一色。"
  source: "王勃《滕王阁序》"
- text: "海内存知己，天涯若比邻。"
  source: "王勃《送杜少府之任蜀州》"
- text: "千磨万击还坚劲，任尔东西南北风。"
  source: "郑燮《竹石》"
- text: "行到水穷处，坐看云起时。"
  source: "王维《终南别业》"
- text: "大鹏一日同风起，扶摇直上九万里。"
  source: "李白《上李邕》"
- text: "长风破浪会有时，直挂云帆济沧海。"
  source: "李白《行路难》"
- text: "会当凌绝顶，一览众山小。"
  source: "杜甫《望岳》"
- text: "桃李春风一杯酒，江湖夜雨十年灯。"
  source: "黄庭坚《寄黄几复》"
- text: "江南无所有，聊赠一枝春。"
  source: "陆凯《赠范晔诗》"
- text: "此中有真意，欲辨已忘言。"
  source: "陶渊明《饮酒·其五》"
- text: "不畏浮云遮望眼，自缘身在最高层。"
  source: "王安石《登飞来峰》"
